name: build windows release

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: setup flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.29.0
          channel: stable
          cache: true

      - name: flutter pub get
        run: flutter pub get

      - name: flutter build windows release
        run: flutter build windows --release

      - name: extract app version
        id: get_version
        shell: pwsh
        run: |
          $line = Select-String -Path pubspec.yaml -Pattern '^version:\s*(.+)$' | Select-Object -First 1
          $version = $line.Matches[0].Groups[1].Value.Trim()
          if ($version -match '^(.+)\+') { $version = $matches[1] }
          echo "VERSION=$version" | Out-File -FilePath $Env:GITHUB_ENV -Encoding utf8 -Append
          echo "app version: $version"

      - name: zip output directory
        shell: pwsh
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath xTend.zip -Force

      - name: upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: xTend-windows-release
          path: xTend.zip
          if-no-files-found: error

      - name: upload github release
        uses: softprops/action-gh-release@v2
        with:
          files: xTend.zip
          tag_name: v${{ env.VERSION }}
          name: xTend v${{ env.VERSION }}
          body: |
            Windows x64 build (Flutter 3.29.0 / windows-2022)

            Mode switch hotkey changed to LS (left stick click) + RS (right stick click).
            Unzip and run `xtend.exe`. A `config.json` is generated next to the exe on first launch.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
